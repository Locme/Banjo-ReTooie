name: build
# The recompiled C (RecompiledFuncs/, rsp/) is committed, so CI builds the game
# without a ROM, the decomp or N64Recomp. Windows is the main target.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  SDL2_VERSION: '2.30.3'
jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        type: [ RelWithDebInfo ]
    name: windows (${{ matrix.type }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-tooie-ccache-${{ matrix.type }}
      - name: Install Windows dependencies
        run: |
          choco install ninja
          Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |-
          $cpuCores = (Get-CimInstance -ClassName Win32_Processor).NumberOfLogicalProcessors
          # Use the clang-cl that ships with Visual Studio, not the standalone LLVM.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne 'C:\Program Files\LLVM\bin' }) -join ';'
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER=clang-cl -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B cmake-build -DCMAKE_CXX_FLAGS="-Xclang -fexceptions -Xclang -fcxx-exceptions"
          cmake --build cmake-build --config ${{ matrix.type }} --target BanjoTooieN64Recomp -j $cpuCores
      - name: Prepare archive
        run: |
          Move-Item -Path "cmake-build/BanjoTooieN64Recomp.exe" -Destination "BanjoTooieN64Recomp.exe"
          Move-Item -Path "cmake-build/dxcompiler.dll" -Destination "dxcompiler.dll"
          Move-Item -Path "cmake-build/dxil.dll" -Destination "dxil.dll"
          Move-Item -Path "cmake-build/SDL2.dll" -Destination "SDL2.dll"
          Move-Item -Path "cmake-build/BanjoTooieN64Recomp.pdb" -Destination "BanjoTooieN64Recomp.pdb"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BanjoTooieN64Recomp-Windows-${{ matrix.type }}
          path: |
            BanjoTooieN64Recomp.exe
            BanjoTooieN64Recomp.pdb
            dxcompiler.dll
            dxil.dll
            SDL2.dll
            assets/
            recompcontrollerdb.txt
            COPYING
            README.md
  build-linux:
    runs-on: ubuntu-22.04
    name: linux (x64, Release)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux-tooie-ccache-Release
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev lld llvm clang-15 libfuse2
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          wget https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz
          tar -xzf SDL2-${SDL2_VERSION}.tar.gz
          cd SDL2-${SDL2_VERSION}
          ./configure
          make -j $(nproc)
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
      - name: Build
        run: |-
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER=clang++-15 -DCMAKE_C_COMPILER=clang-15 -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B cmake-build
          cmake --build cmake-build --config Release --target BanjoTooieN64Recomp -j $(nproc)
      - name: Prepare archive
        run: |
          mv cmake-build/BanjoTooieN64Recomp BanjoTooieN64Recomp
          tar -czf BanjoTooieN64Recomp.tar.gz BanjoTooieN64Recomp assets/ recompcontrollerdb.txt COPYING README.md
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BanjoTooieN64Recomp-Linux-X64-Release
          path: BanjoTooieN64Recomp.tar.gz
