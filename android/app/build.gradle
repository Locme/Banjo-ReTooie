// The Android build of the port (android/README.md). The game itself is the same CMake project as the
// desktop builds (../../CMakeLists.txt), built for arm64 phones as libmain.so.
plugins {
    id 'com.android.application'
}

// The release key: banjoretooie-release.properties (storeFile, storePassword, keyAlias, keyPassword) in the user's
// .android folder, or the file BANJORETOOIE_KEYSTORE_PROPERTIES names. It lives outside the repo and is never
// committed. Without it the APK is signed with the debug key, and a phone with a release-signed copy will not take
// it as an update.
def releaseKeyFile = file(System.getenv('BANJORETOOIE_KEYSTORE_PROPERTIES') ?:
        "${System.getProperty('user.home')}/.android/banjoretooie-release.properties")
def releaseKey = new Properties()
if (releaseKeyFile.exists()) {
    releaseKeyFile.withInputStream { releaseKey.load(it) }
}

android {
    namespace 'io.github.locme.banjotooie'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        // The app's id, and so its folder on the phone: Android/data/io.banjoretooie/files (L, 2026-11-07). The Java
        // classes keep their package (namespace above).
        applicationId 'io.banjoretooie'
        // Android 10: every phone from then on has Vulkan 1.1, which RT64 needs.
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '0.9.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // libc++ is shared because SDL2 and the game are separate libraries.
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_PLATFORM=android-29'
                targets 'BanjoTooieN64Recomp', 'SDL2'
            }
        }
    }

    signingConfigs {
        release {
            if (releaseKeyFile.exists()) {
                storeFile file(releaseKey['storeFile'])
                storePassword releaseKey['storePassword']
                keyAlias releaseKey['keyAlias']
                keyPassword releaseKey['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeyFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            assets.srcDirs += layout.buildDirectory.dir('generated/game_assets')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The menus read assets/ and recompcontrollerdb.txt from the working directory. They go into the APK as
// game_files/, and GameActivity unpacks them into the app's internal folder before the game starts.
def copyGameAssets = tasks.register('copyGameAssets', Copy) {
    from('../../assets') { into 'game_files/assets' }
    from('../../recompcontrollerdb.txt') { into 'game_files' }
    into layout.buildDirectory.dir('generated/game_assets')
}
tasks.named('preBuild') { dependsOn copyGameAssets }
