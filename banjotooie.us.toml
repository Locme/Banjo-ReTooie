# N64Recomp config for Banjo-Tooie (USA).
# The input is the decomp's byte-matching ELF (see BUILDING.md), which carries
# every function symbol and relocation. Paths are relative to this file.

[input]
entrypoint = 0x80000400
elf_path = "banjotooie.us.elf"
output_func_path = "RecompiledFuncs"
# The 851 overlays all link at 0x80800000 and are relocated by the game at
# load time, so their code must use runtime section addresses.
relocatable_sections_path = "overlays.us.txt"
bss_section_suffix = "_bss"
# tooie_hooks.h declares the host functions the hooks below call.
recomp_include = """#include "recomp.h"
#include "tooie_hooks.h""""

# BEGIN GENERATED manual_funcs (tools/gen_recomp_config.py)
manual_funcs = [
    { name = "func_80013B90", section = ".core1", vram = 0x80013B90, size = 0xB8 },
]
# END GENERATED manual_funcs


[patches]
# The boot segment carries its own copy of libultra. The boot code only uses
# three of these functions (see "ignored"); the rest touch hardware that the
# runtime replaces, so they are emptied.
stubs = [
    "boot___osDisableInt",
    "boot___osRestoreInt",
    "boot___osSetSR",
    "boot___osGetSR",
    "boot___osSetFpcCsr",
    "boot___osSiRawReadIo",
    "boot___osSiRawWriteIo",
    "boot___osExceptionPreambleDuplicate",
    "boot___osExceptionPreamble",
    "boot___osException",
    "boot_send_mesg",
    "boot_handle_CpU",
    "boot___osEnqueueAndYield",
    "boot___osEnqueueThread",
    "boot___osPopThread",
    "boot___osDispatchThread",
    "boot___osCleanupThread",
    "boot_osWritebackDCache",
    "boot_osInvalICache",
    "boot_osUnmapTLBAll",
    "boot_osMapTLBRdb",
    "boot___osGetCause",
    "boot_osCreatePiManager",
    "boot_osVirtualToPhysical",
    "boot___osDequeueThread",
    "boot___osSiDeviceBusy",
    "boot_osSetEventMesg",
    "boot_osSetIntMask",
    "boot_osDestroyThread",
    "boot_osCreateMesgQueue",
    "boot___osPiCreateAccessQueue",
    "boot___osPiGetAccess",
    "boot___osPiRelAccess",
    "boot_osGetThreadPri",
    "boot_osSetThreadPri",
    "boot___osEPiRawStartDma",
    "boot_osCreateThread",
    "boot___osDevMgrMain",
    "boot_osStartThread",
    "boot___osProbeTLB",
    "boot_osSendMesg",
    "boot_osRecvMesg",
    "boot___osResetGlobalIntMask",
    "boot___osEPiRawWriteIo",
    "boot___osEPiRawReadIo",
    "boot___osSetGlobalIntMask",
    "boot_osYieldThread",
]
# Game symbols whose names clash with librecomp (wait_one_frame is also in vi.cpp;
# MSVC/lld-link rejects the duplicate). N64Recomp appends _recomp to these.
renamed = ["wait_one_frame"]

ignored = [
    # Boot libultra the boot code calls; implemented on the host in
    # src/game/boot.cpp (ROM reads go straight to the runtime).
    "boot_osInitialize",
    "boot___osPiRawStartDma",
    "boot_osPiGetStatus",
    # Reads the cop0 Count register, which N64Recomp cannot express.
    "func_8001DDC0",
    # Reads a word straight from the cartridge (0xB0000000 + offset) with
    # interrupts masked through cop0 Status. Implemented in src/game/cic.cpp.
    "rom_read_word",
    # Returns cop0 Status. The scheduler halts the game (its reset handler)
    # unless interrupt mask bit 5 is set, which the runtime never sets.
    # Implemented in src/game/boot.cpp.
    "__osGetSR_2",
    # Builds a camera's culling planes. Implemented in src/game/widescreen.cpp
    # so culling widens with the picture (Aspect Ratio: Expand); func_800CA218
    # and func_800CA1B0 make the left and right planes.
    "func_800CA2A8",
    "func_800CA218",
    "func_800CA1B0",
    # Templates copied into each loaded overlay header, never executed in place.
    "ovl_entrypoint",
    "ovl_entrypoint_alternate",
]

# --- Overlay relocation (func_80082088) -------------------------------------
# It reads the PI status register and the per-overlay relocation key straight
# from the cartridge (uncached ROM at 0xB0000040 + 4 * overlay index, inside
# the IPL3 area). Neither address exists on the host.

# lw $t2, 0($t1) (PI status) -> or $t2, $zero, $zero: the DMA is never busy.
[[patches.instruction]]
func = "func_80082088"
vram = 0x80082138
value = 0x00005025

[[patches.instruction]]
func = "func_80082088"
vram = 0x80082144
value = 0x00005025

# lw $s5, 0x40($s5) -> or $s5, $s5, $zero; the hook reads the key instead.
[[patches.hook]]
func = "func_80082088"
before_vram = 0x80082148
text = "tooie_read_overlay_key(rdram, ctx);"

[[patches.instruction]]
func = "func_80082088"
vram = 0x80082148
value = 0x02A0A825

# The overlay's code is now relocated at $s2, either freshly loaded or moved by
# the heap defragmenter (ovl_shift). Map its recompiled functions there.
[[patches.hook]]
func = "func_80082088"
before_vram = 0x800821D4
text = "tooie_overlay_placed(rdram, ctx);"

# The overlay at $a0 is about to be freed (unless it is pinned, flag 4).
[[patches.hook]]
func = "ovl_unload"
before_vram = 0x800819E4
text = "tooie_overlay_unloading(rdram, ctx);"

# --- Anti-tamper boot words (func_8001DE64) ---------------------------------
# The CIC thread reads two words the IPL3 leaves in RDRAM through uncached
# addresses (0xA02FB1F4, 0xA02FE1C0) and flags tampering unless they are
# 0xAD090010 and 0xAD170014. The host never ran an IPL3, so load the expected
# values directly.

# lui $t6, 0xA030 -> lui $t7, 0xAD09
[[patches.instruction]]
func = "func_8001DE64"
vram = 0x8001DE70
value = 0x3C0FAD09

# lw $t7, -0x4E0C($t6) -> ori $t7, $t7, 0x0010
[[patches.instruction]]
func = "func_8001DE64"
vram = 0x8001DE74
value = 0x35EF0010

# lui $t8, 0xA030 -> lui $t9, 0xAD17
[[patches.instruction]]
func = "func_8001DE64"
vram = 0x8001DE80
value = 0x3C19AD17

# lw $t9, -0x1E40($t8) -> ori $t9, $t9, 0x0014
[[patches.instruction]]
func = "func_8001DE64"
vram = 0x8001DE88
value = 0x37390014

# --- Float helpers that return through a copy of $ra (core1 1E2B200) --------
# Hand-written sinf/cosf/atan wrappers keep $ra in $a1/$a3 across a jal and
# return with `jr $a1`/`jr $a3`. The recompiled jal is a host call that leaves
# no return address behind, so return with `jr $ra` instead.
[[patches.instruction]]
func = "func_800137D4"
vram = 0x800137EC
value = 0x03E00008

[[patches.instruction]]
func = "func_800137F4"
vram = 0x80013810
value = 0x03E00008

[[patches.instruction]]
func = "func_80013A5C"
vram = 0x80013A74
value = 0x03E00008

[[patches.instruction]]
func = "func_80013A7C"
vram = 0x80013A98
value = 0x03E00008

# --- Busy-wait loops that need a preemption point (src/game/preempt.cpp) ----
# func_800C2AB8 spins until every pending sound/music slot's audio object is
# released, which the audio thread does. Without a preemption point the main
# thread never lets it run and the game freezes on the first level load after
# the intro. Runs once per pass while some slot is still busy ($s3 != 0).
[[patches.hook]]
func = "func_800C2AB8"
before_vram = 0x800C2B50
text = "if (ctx->r19 != 0) tooie_preempt_point(rdram, ctx);"

# --- Map warps (src/debug/warp.cpp) ------------------------------------------
# func_800A7D84 is the per-frame game-state update that acts on map change
# requests. Warps are issued from its entry, on the game thread between frames.
[[patches.hook]]
func = "func_800A7D84"
before_vram = 0x800A7D84
text = "tooie_warp_tick(rdram, ctx);"

# --- HUD at the screen edges (src/game/hud_edges.cpp) -----------------------
# scinfobar_entrypoint_24 draws one HUD element. Mark where its display list
# starts (entry) and fix it up when it is done (the return, while $s1 still
# holds the graphics context).
[[patches.hook]]
func = "scinfobar_entrypoint_24"
before_vram = 0x80800764
text = "tooie_hud_element_begin(rdram, ctx);"

[[patches.hook]]
func = "scinfobar_entrypoint_24"
before_vram = 0x80800898
text = "tooie_hud_element_end(rdram, ctx);"

# --- Dialogue text speed (src/gameplay/dialogue_speed.cpp) ------------------
# gczoombox_entrypoint_4, printing state: the print timer at +0x1D4($s0) has
# just been advanced by the frame time in $f0.
[[patches.hook]]
func = "gczoombox_entrypoint_4"
before_vram = 0x808020EC
text = "tooie_dialogue_timer_advanced(rdram, ctx);"

# --- Hide HUD, F1 (src/game/hide_hud.cpp) ------------------------------------
# func_800A73F4 draws the frame. After the 3D scene, with the graphics context
# in $s1, it calls func_800C0984 (pause menu backdrop and icons),
# func_800C0130 (text box portraits), func_800FA508 (the HUD) and
# func_800B7448 (text boxes and menu text). Marks before and after each let
# the host drop what the last three drew while the HUD is hidden. The mark at
# 0x800A7404 records where the frame's display list starts, for the matrix
# tagging that the first mark runs (src/game/model_tagging.cpp).
[[patches.hook]]
func = "func_800A73F4"
before_vram = 0x800A7404
text = "tooie_scene_begin(rdram, ctx);"

[[patches.hook]]
func = "func_800A73F4"
before_vram = 0x800A74C8
text = "tooie_draw2d_mark(rdram, ctx, 0);"

[[patches.hook]]
func = "func_800A73F4"
before_vram = 0x800A74D0
text = "tooie_draw2d_mark(rdram, ctx, 1);"

[[patches.hook]]
func = "func_800A73F4"
before_vram = 0x800A74DC
text = "tooie_draw2d_mark(rdram, ctx, 2);"

[[patches.hook]]
func = "func_800A73F4"
before_vram = 0x800A74E4
text = "tooie_draw2d_mark(rdram, ctx, 3);"

[[patches.hook]]
func = "func_800A73F4"
before_vram = 0x800A74FC
text = "tooie_draw2d_mark(rdram, ctx, 4);"

[[patches.hook]]
func = "func_800A73F4"
before_vram = 0x800A7504
text = "tooie_draw2d_mark(rdram, ctx, 5);"

[[patches.hook]]
func = "func_800A73F4"
before_vram = 0x800A750C
text = "tooie_draw2d_mark(rdram, ctx, 6);"
# --- Level transition speed (src/gameplay/fast_transitions.cpp) -------------
# gctransitionDll_entrypoint_9 updates a screen wipe: the frame time is in $f2
# and the wipe in $a3 here.
[[patches.hook]]
func = "gctransitionDll_entrypoint_9"
before_vram = 0x80800A78
text = "tooie_transition_frame(rdram, ctx);"

# func_808000D8_gctransitionDll has just set the wipe animation's length.
[[patches.hook]]
func = "func_808000D8_gctransitionDll"
before_vram = 0x808001D0
text = "tooie_transition_anim_length(rdram, ctx);"

# --- Screen wipes in wide pictures (src/game/wide_transitions.cpp) ----------
# func_80800098_gctransitionDll sizes a shaped wipe's model for the viewport;
# the scale is in $f10 before it is stored.
[[patches.hook]]
func = "func_80800098_gctransitionDll"
before_vram = 0x808000C4
text = "tooie_wipe_model_scale(rdram, ctx);"

# --- Unlock all moves, 4.71 (src/gameplay/progress_cheats.cpp) ---------------
# func_800DA298 is the game flag getter: flag in $a0 at entry, result in $v0 at
# its single jr $ra.
[[patches.hook]]
func = "func_800DA298"
before_vram = 0x800DA298
text = "tooie_flag_get_enter(rdram, ctx);"

[[patches.hook]]
func = "func_800DA298"
before_vram = 0x800DA3B0
text = "tooie_flag_get_leave(rdram, ctx);"

# --- Free camera (src/gameplay/free_camera.cpp) -----------------------------
# func_8010FC38 steps a viewport's camera controller ($s0). Here its mode has
# just placed the camera and $a0 holds the viewport camera; the host turns the
# camera about Banjo before the shake is added and the matrices are built.
[[patches.hook]]
func = "func_8010FC38"
before_vram = 0x8010FCB8
text = "tooie_free_camera(rdram, ctx);"

# --- High-detail models, 4.28 (src/gameplay/high_detail_models.cpp) --------
# Geo LOD command (8): func_800DD214 (draw pass), func_800DD2E8 (matrix pass)
# and func_800DD37C (a third pass) have the squared camera distance in $f0
# here, just after func_800EEB40.
[[patches.hook]]
func = "func_800DD214"
before_vram = 0x800DD294
text = "tooie_lod_distance(rdram, ctx);"

[[patches.hook]]
func = "func_800DD2E8"
before_vram = 0x800DD328
text = "tooie_lod_distance(rdram, ctx);"

[[patches.hook]]
func = "func_800DD37C"
before_vram = 0x800DD3BC
text = "tooie_lod_distance(rdram, ctx);"

# --- Distance probe, debug (src/debug/distance_probe.cpp) -------------------
# Counts callers of the distance helpers when TOOIE_DISTANCE_PROBE is set.
[[patches.hook]]
func = "func_800EEAD4"
before_vram = 0x800EEAD4
text = "tooie_distance_probe(rdram, ctx, 0);"

[[patches.hook]]
func = "func_800EEB40"
before_vram = 0x800EEB40
text = "tooie_distance_probe(rdram, ctx, 1);"

# --- Field of view, 4.24 (src/gameplay/field_of_view.cpp) -------------------
# func_800CA558(camera, fov) is the viewport FOV setter; the FOV is in $a1.
[[patches.hook]]
func = "func_800CA558"
before_vram = 0x800CA558
text = "tooie_set_fov(rdram, ctx);"

# func_8010FC38 steps a viewport's camera controller ($a0); remembers its mode.
[[patches.hook]]
func = "func_8010FC38"
before_vram = 0x8010FC38
text = "tooie_camera_controller_step(rdram, ctx);"
