# --- Bigger animation caches (func_800D56C4 to func_800D731C) ----------------
# Two fixed caches hold the animations in use. Animation files: 130 slots
# (ids at 0x8012B6E0, use counts at 0x8012B658, pointers at 0x8012B450;
# func_800D5AB4 gives -1 once 0x82 are loaded). Animations: a sorted table of
# 12-byte entries at 0x8012B800 with room for 136 (0x8012BE60 ends it,
# func_800D66AC clears it; func_800D674C refuses a new one once 0x87 are
# loaded). A full cache makes func_800D674C return NULL, which the caller reads
# at once (func_800E0414 crashes): a crowded scene (many characters at once)
# loads more than that. Move them into the 16 KB below the bigger heap, which
# the lui 0x8013 already in each use reaches (0x80137800 = 0x8013 << 16 +
# 0x7800): ids 0x80137800, use counts 0x801379E0, pointers 0x80137AD0 (240
# slots each, the count is a byte), table 0x80137E90 (1024 entries, to
# 0x8013AE90). Raise the limits to 0xF0 and 0x3FF. Every use was found by
# tracking lui 0x8013 to an offset inside the old arrays.

