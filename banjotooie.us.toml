# N64Recomp config for Banjo-Tooie (USA).
# The input is the decomp's byte-matching ELF (see BUILDING.md), which carries
# every function symbol and relocation. Paths are relative to this file.

[input]
entrypoint = 0x80000400
elf_path = "banjotooie.us.elf"
output_func_path = "RecompiledFuncs"
# The 851 overlays all link at 0x80800000 and are relocated by the game at
# load time, so their code must use runtime section addresses.
relocatable_sections_path = "overlays.us.txt"
bss_section_suffix = "_bss"
# tooie_hooks.h declares the host functions the hooks below call.
recomp_include = """#include "recomp.h"
#include "tooie_hooks.h""""

# BEGIN GENERATED manual_funcs (tools/gen_recomp_config.py)
manual_funcs = [
    { name = "func_80800324_bsledge", section = ".bsledge", vram = 0x80800324, size = 0x10 },
    { name = "func_80800000_bsrest", section = ".bsrest", vram = 0x80800000, size = 0x3C },
    { name = "func_80013B90", section = ".core1", vram = 0x80013B90, size = 0xB8 },
    { name = "func_8002DC78", section = ".core1", vram = 0x8002DC78, size = 0x28 },
]
# END GENERATED manual_funcs


[patches]
# The boot segment carries its own copy of libultra. The boot code only uses
# three of these functions (see "ignored"); the rest touch hardware that the
# runtime replaces, so they are emptied.
stubs = [
    "boot___osDisableInt",
    "boot___osRestoreInt",
    "boot___osSetSR",
    "boot___osGetSR",
    "boot___osSetFpcCsr",
    "boot___osSiRawReadIo",
    "boot___osSiRawWriteIo",
    "boot___osExceptionPreambleDuplicate",
    "boot___osExceptionPreamble",
    "boot___osException",
    "boot_send_mesg",
    "boot_handle_CpU",
    "boot___osEnqueueAndYield",
    "boot___osEnqueueThread",
    "boot___osPopThread",
    "boot___osDispatchThread",
    "boot___osCleanupThread",
    "boot_osWritebackDCache",
    "boot_osInvalICache",
    "boot_osUnmapTLBAll",
    "boot_osMapTLBRdb",
    "boot___osGetCause",
    "boot_osCreatePiManager",
    "boot_osVirtualToPhysical",
    "boot___osDequeueThread",
    "boot___osSiDeviceBusy",
    "boot_osSetEventMesg",
    "boot_osSetIntMask",
    "boot_osDestroyThread",
    "boot_osCreateMesgQueue",
    "boot___osPiCreateAccessQueue",
    "boot___osPiGetAccess",
    "boot___osPiRelAccess",
    "boot_osGetThreadPri",
    "boot_osSetThreadPri",
    "boot___osEPiRawStartDma",
    "boot_osCreateThread",
    "boot___osDevMgrMain",
    "boot_osStartThread",
    "boot___osProbeTLB",
    "boot_osSendMesg",
    "boot_osRecvMesg",
    "boot___osResetGlobalIntMask",
    "boot___osEPiRawWriteIo",
    "boot___osEPiRawReadIo",
    "boot___osSetGlobalIntMask",
    "boot_osYieldThread",
]
# Game symbols whose names clash with librecomp (wait_one_frame is also in vi.cpp;
# MSVC/lld-link rejects the duplicate). N64Recomp appends _recomp to these.
renamed = ["wait_one_frame"]

ignored = [
    # Boot libultra the boot code calls; implemented on the host in
    # src/game/boot.cpp (ROM reads go straight to the runtime).
    "boot_osInitialize",
    "boot___osPiRawStartDma",
    "boot_osPiGetStatus",
    # Reads the cop0 Count register, which N64Recomp cannot express.
    "func_8001DDC0",
    # Reads a word straight from the cartridge (0xB0000000 + offset) with
    # interrupts masked through cop0 Status. Implemented in src/game/cic.cpp.
    "rom_read_word",
    # Returns cop0 Status. The scheduler halts the game (its reset handler)
    # unless interrupt mask bit 5 is set, which the runtime never sets.
    # Implemented in src/game/boot.cpp.
    "__osGetSR_2",
    # Builds a camera's culling planes. Implemented in src/game/widescreen.cpp
    # so culling widens with the picture (Aspect Ratio: Expand); func_800CA218
    # and func_800CA1B0 make the left and right planes.
    "func_800CA2A8",
    "func_800CA218",
    "func_800CA1B0",
    # Templates copied into each loaded overlay header, never executed in place.
    "ovl_entrypoint",
    "ovl_entrypoint_alternate",
]

# --- Bigger game heap (func_8001E7E0, func_8001E830) -------------------------
# These sections (heap, frame buffers, sound voices, animation caches) are switched by
# General > More game memory: the generated code holds both values at each
# patched instruction, "if (tooie_more_memory()) <patched> else <original>"
# (hand edits, src/game/more_memory.cpp). Redo them after regenerating.
# The game's heap ends at the top func_8001E7E0 returns (0x80400000) and is
# func_8001E830 bytes long (0x2C8800), so it spans 0x80137800-0x80400000 and the
# rest of the 8 MB Expansion Pak sits unused. Too many actors at once run it
# out and heap_alloc_sided crashes. Raise the top to 0x80E00000
# (below the 44.1 kHz audio buffers at 0x80E00000 and the model tagging lists at
# 0x80F00000, src/gameplay/mix_rate.cpp and src/game/model_tagging.cpp) and make
# it 0xCC4800 long, so it starts at 0x8013B800: the 16 KB below it holds the
# bigger animation caches (below). Everything stays below 16 MB, which
# RT64 addresses (24-bit segment offsets).

# lui $v0, 0x8040 -> lui $v0, 0x80E0
[[patches.instruction]]
func = "func_8001E7E0"
vram = 0x8001E7E4
value = 0x3C0280E0

# lui $v0, 0x2C -> lui $v0, 0xCC
[[patches.instruction]]
func = "func_8001E830"
vram = 0x8001E830
value = 0x3C0200CC

# ori $v0, $v0, 0x8800 -> ori $v0, $v0, 0x4800 (0xCC4800)
[[patches.instruction]]
func = "func_8001E830"
vram = 0x8001E838
value = 0x34424800

# --- Bigger frame buffers for display lists, matrices and vertices (func_8001A3A0)
# The game builds each frame's display list, matrices and vertices in two pairs
# of fixed heap buffers: 0x76C0 bytes of display list (3800 commands), 0x12C00
# of matrices and 0x1AE0 of vertices. Nothing checks the end, so a crowded scene
# (many characters at once) writes past them into the next heap block and a later
# heap_alloc_sided crashes. Make them 0x40000, 0x92C00 and 0xD700 (about 8x),
# about 1.7 MB more out of the 10 MB the bigger heap above adds.

# addiu $a0, $zero, 0x76C0 -> lui $a0, 0x4 (display list, both buffers)
[[patches.instruction]]
func = "func_8001A3A0"
vram = 0x8001A3BC
value = 0x3C040004

[[patches.instruction]]
func = "func_8001A3A0"
vram = 0x8001A3CC
value = 0x3C040004

# lui $a0, 0x1 -> lui $a0, 0x9 (with ori 0x2C00: matrices, both buffers)
[[patches.instruction]]
func = "func_8001A3A0"
vram = 0x8001A3D4
value = 0x3C040009

[[patches.instruction]]
func = "func_8001A3A0"
vram = 0x8001A3E8
value = 0x3C040009

# addiu $a0, $zero, 0x1AE0 -> ori $a0, $zero, 0xD700 (vertices, both buffers)
[[patches.instruction]]
func = "func_8001A3A0"
vram = 0x8001A404
value = 0x3404D700

[[patches.instruction]]
func = "func_8001A3A0"
vram = 0x8001A414
value = 0x3404D700

# --- More sound voices and sample DMA buffers (func_8001268C, func_80012D4C) --
# The synthesizer is set up with 24 voices (maxVVoices and maxPVoices) and 128
# updates, and 90 sample DMA buffers of 0x200 bytes kept in a static list at
# 0x80069A40 (0x14 bytes each). With more sounds at once than voices, the extra
# ones are dropped. Give it 48 voices, 256 updates and 180 DMA buffers, their
# list moved to 0x80EE0000 (src/gameplay/mix_rate.cpp moves the audio heap and
# command lists into 0x80E00000-0x80F00000 first, as they need more room).

