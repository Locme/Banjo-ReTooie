# --- Busy-wait loops that need a preemption point (src/game/preempt.cpp) ----
# func_800C2AB8 spins until every pending sound/music slot's audio object is
# released, which the audio thread does. Without a preemption point the main
# thread never lets it run and the game freezes on the first level load after
# the intro. Runs once per pass while some slot is still busy ($s3 != 0).
# tooie_sound_slot_wait also frees a slot whose sound never reports finished
# within 2 s and logs it, rather than freezing forever (L's hang of 2026-10-16).
[[patches.hook]]
func = "func_800C2AB8"
before_vram = 0x800C2B50
text = "if (ctx->r19 != 0) tooie_sound_slot_wait(rdram, ctx);"

# func_800C15BC (get a sound handle) rescans while a handle is only waiting on
# the sound player to finish its sound; the same kind of loop. After 2 s it
# gives up and returns no handle, as it does when the game holds all 16.
[[patches.hook]]
func = "func_800C15BC"
before_vram = 0x800C168C
text = "if (SIGNED(ctx->r2) < 0x10 && tooie_sound_handle_wait(rdram, ctx)) { ctx->r2 = 0; return; }"

