# --- Overlay relocation (func_80082088) -------------------------------------
# It reads the PI status register and the per-overlay relocation key straight
# from the cartridge (uncached ROM at 0xB0000040 + 4 * overlay index, inside
# the IPL3 area). Neither address exists on the host.

# lw $t2, 0($t1) (PI status) -> or $t2, $zero, $zero: the DMA is never busy.
[[patches.instruction]]
func = "func_80082088"
vram = 0x80082138
value = 0x00005025

[[patches.instruction]]
func = "func_80082088"
vram = 0x80082144
value = 0x00005025

# lw $s5, 0x40($s5) -> or $s5, $s5, $zero; the hook reads the key instead.
[[patches.hook]]
func = "func_80082088"
before_vram = 0x80082148
text = "tooie_read_overlay_key(rdram, ctx);"

[[patches.instruction]]
func = "func_80082088"
vram = 0x80082148
value = 0x02A0A825

# The overlay's code is now relocated at $s2, either freshly loaded or moved by
# the heap defragmenter (ovl_shift). Map its recompiled functions there.
[[patches.hook]]
func = "func_80082088"
before_vram = 0x800821D4
text = "tooie_overlay_placed(rdram, ctx);"

# The overlay at $a0 is about to be freed (unless it is pinned, flag 4).
[[patches.hook]]
func = "ovl_unload"
before_vram = 0x800819E4
text = "tooie_overlay_unloading(rdram, ctx);"

# --- Heap guard (src/game/heap_guard.cpp) -----------------------------------
# Before func_8001C0A0 walks the heap's block list (heap_alloc_sided's third kind
# of allocation), repair a next link that points outside the heap or at a block
# that doesn't link back (L's crash of 2026-10-15: a link that lost its top bit).
[[patches.hook]]
func = "func_8001C0A0"
before_vram = 0x8001C0A0
text = "tooie_heap_guard(rdram, ctx);"

# chanim_entrypoint_6 frees an actor's animation; the intro characters of 0xAC and 0x199 call it
# with none when the cutscene is entered straight from another map (src/game/cutscene_guards.cpp).
[[patches.hook]]
func = "chanim_entrypoint_6"
before_vram = 0x808001C4
text = "if (tooie_chanim_missing(rdram, ctx)) { ctx->r29 = ADD32(ctx->r29, 0X20); return; }"

# The intro cutscenes wait here for the intro music's cue; skipped while a texture sweep runs.
[[patches.hook]]
func = "glintrosyncDll_entrypoint_1"
before_vram = 0x808002A8
text = "if (tooie_intro_sync_skip(rdram, ctx)) { ctx->r16 = 0; }"

# Tower of Tragedy's quiz looks up the player it is about to set up (func_800A9478, -1 when not
# found) and hands that index to func_800F5EF8, which read address 0 with -1 (L's sweep crash of
# 2026-10-16 15:55:17). With no player found it is left alone.
[[patches.hook]]
func = "func_80800F34_chquiz"
before_vram = 0x80800F50
text = "if (tooie_quiz_no_player(rdram, ctx)) { ctx->r29 = ADD32(ctx->r29, 0X20); return; }"

# The multiplayer quiz (0x189) entered with one player: ncpod_entrypoint_29 asks func_80110024 for an
# object that isn't there and read through null. With none it returns 0, as its caller
# (capod_entrypoint_17) does when it finds nothing (src/game/cutscene_guards.cpp).
[[patches.hook]]
func = "ncpod_entrypoint_29"
before_vram = 0x80800F04
text = "if (tooie_null_guard(rdram, ctx, \"ncpod_entrypoint_29\")) { ctx->r2 = 0; ctx->r29 = ADD32(ctx->r29, 0X18); return; }"

# --- Anti-tamper boot words (func_8001DE64) ---------------------------------
# The CIC thread reads two words the IPL3 leaves in RDRAM through uncached
# addresses (0xA02FB1F4, 0xA02FE1C0) and flags tampering unless they are
# 0xAD090010 and 0xAD170014. The host never ran an IPL3, so load the expected
# values directly.

